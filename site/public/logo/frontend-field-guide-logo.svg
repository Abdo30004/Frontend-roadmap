<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Frontend Field Guide logo" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .body { fill: #172554; }
    .ant  { fill: none; stroke: #172554; stroke-width: 5; stroke-linecap: round; }
    .path { fill: none; stroke: #34d399; stroke-width: 5; stroke-linecap: round; }
    .start { fill: #172554; stroke: #34d399; stroke-width: 4; }
    .end  { fill: #34d399; }
    @media (prefers-color-scheme: dark) {
      .body { fill: #4f46e5; }
      .ant  { stroke: #4f46e5; }
      .start { fill: #4f46e5; }
    }
  </style>
  <!-- antennae -->
  <path class="ant" d="M58 25 C54 16 48 12 41 11"/>
  <path class="ant" d="M70 25 C74 16 80 12 87 11"/>
  <!-- head -->
  <ellipse class="body" cx="64" cy="33" rx="13" ry="9.5"/>
  <!-- shell -->
  <path class="body" d="M64 46 C88 46 97 63 97 82 C97 104 82 118 64 118 C46 118 31 104 31 82 C31 63 40 46 64 46 Z"/>
  <!-- the path: from the bug (hollow) to the fix (filled) -->
  <path class="path" d="M64 59 C90 70 38 92 64 105"/>
  <circle class="start" cx="64" cy="59" r="5"/>
  <circle class="end" cx="64" cy="105" r="6"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
