name: Translation
description: Improve a translation, or offer to translate the guide into a new language.
title: "[i18n] "
labels: ["translation"]
body:
  - type: markdown
    attributes:
      value: Vous pouvez écrire en français.
  - type: dropdown
    id: kind
    attributes:
      label: What is it about?
      options:
        - A French text is wrong or unclear
        - A text is not translated
        - A new language
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: The page link, or the file (`content/fr/...`, `site/src/i18n/fr.ts`, `site/src/demos/fr.ts`).
  - type: textarea
    id: details
    attributes:
      label: Details
      description: The current text and what it should say.
    validations:
      required: true
