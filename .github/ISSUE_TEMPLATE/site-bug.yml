name: Site bug
description: Something on the website does not work or looks broken.
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The link where it happens.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. A screenshot helps.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 131 on Windows, Safari on iPhone 15…
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme and language
      multiple: true
      options:
        - Light
        - Dark
        - English
        - French
